name: Acuity Availability Monitor

on:
  # GitHub's cron floor is ~5 min, so each run stays alive and polls
  # internally every 60s. A new run every 30 min takes over from the last.
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor]

# A newly started run replaces the previous one, so a hung or stalled run
# can never block coverage.
concurrency:
  group: availability-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run monitor
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          CHECK_INTERVAL_SEC: '60'
          RUN_DURATION_SEC:   '1920'   # 32 min — overlaps the next run slightly
        run: python monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && echo "No state change." && exit 0
          git commit -m "chore: update monitor state [skip ci]"
          git pull --rebase origin main
          git push || echo "Push failed, will retry next run."
