name: Acuity Availability Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor]

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run monitor (discovery mode)
        run: python monitor.py
